<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Kallagunta Balaji — Software Engineer and AI/ML Enthusiast</title>
  <desc id="desc">A professional dark navy profile banner highlighting Python, Java, machine learning, and natural language processing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#17263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" rx="24" fill="url(#background)"/>
  <rect width="1600" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1460" cy="55" r="250" fill="#2563eb" opacity="0.10"/>
  <circle cx="1320" cy="405" r="230" fill="#8b5cf6" opacity="0.09"/>
  <rect x="84" y="72" width="8" height="294" rx="4" fill="url(#accent)"/>
  <text x="128" y="143" fill="#e2e8f0" font-size="24" font-family="Segoe UI, Arial, sans-serif" letter-spacing="4">SOFTWARE ENGINEER • AI/ML</text>
  <text x="124" y="220" fill="#ffffff" font-size="62" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Kallagunta Balaji</text>
  <text x="128" y="274" fill="#cbd5e1" font-size="25" font-family="Segoe UI, Arial, sans-serif">Building practical software and applied machine learning projects.</text>
  <text x="128" y="329" fill="#7dd3fc" font-size="21" font-family="Segoe UI, Arial, sans-serif">Python  /  Core Java  /  NLP  /  Computer Vision</text>
  <g transform="translate(1110 118)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="370" height="218" rx="22" fill="#0b1423" fill-opacity="0.72" stroke="#64748b" stroke-opacity="0.35"/>
    <text x="30" y="49" fill="#e2e8f0" font-size="19" font-weight="700" letter-spacing="2">FOCUS AREAS</text>
    <g font-size="18" fill="#dbeafe">
      <rect x="28" y="74" width="143" height="42" rx="21" fill="#1e3a5f"/><text x="50" y="101">Machine Learning</text>
      <rect x="184" y="74" width="151" height="42" rx="21" fill="#312e81"/><text x="206" y="101">Natural Language</text>
      <rect x="28" y="132" width="143" height="42" rx="21" fill="#164e63"/><text x="51" y="159">Computer Vision</text>
      <rect x="184" y="132" width="151" height="42" rx="21" fill="#334155"/><text x="220" y="159">Data Projects</text>
    </g>
    <rect x="30" y="190" width="310" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
