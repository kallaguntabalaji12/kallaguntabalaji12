<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Kallagunta Balaji Banner</title>
  <desc id="desc">Profile banner for Kallagunta Balaji with software engineering and AI ML themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="35%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="200" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="1450" cy="280" r="220" fill="#8b5cf6" opacity="0.10"/>
  <circle cx="1280" cy="110" r="120" fill="#22c55e" opacity="0.08"/>

  <g transform="translate(80,55)">
    <rect x="0" y="0" width="580" height="290" rx="26" fill="#111827" stroke="rgba(255,255,255,0.18)"/>
    <text x="42" y="90" fill="#E5E7EB" font-size="52" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Kallagunta Balaji</text>
    <text x="42" y="145" fill="#7dd3fc" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Software Engineer • AI/ML Enthusiast</text>
    <rect x="42" y="170" width="220" height="8" rx="4" fill="url(#accent)"/>
    <text x="42" y="235" fill="#D1D5DB" font-size="22" font-family="Segoe UI, Arial, sans-serif">Python • Java • Web Dev • Data Science</text>
    <text x="42" y="270" fill="#94A3B8" font-size="18" font-family="Segoe UI, Arial, sans-serif">Open to entry-level Software Engineer and AI/ML opportunities</text>
  </g>

  <g transform="translate(760,72)">
    <rect x="0" y="0" width="660" height="260" rx="24" fill="rgba(15,23,42,0.55)" stroke="rgba(148,163,184,0.3)"/>
    <g fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif">
      <text x="42" y="58" font-size="30" font-weight="700">Core Skills</text>
      <g font-size="22">
        <text x="42" y="110">Python</text>
        <text x="185" y="110">Core Java</text>
        <text x="350" y="110">SQL</text>
        <text x="455" y="110">HTML/CSS</text>

        <text x="42" y="160">YOLOv8</text>
        <text x="170" y="160">OpenCV</text>
        <text x="310" y="160">RoBERTa</text>
        <text x="470" y="160">BiLSTM</text>

        <text x="42" y="210">Streamlit</text>
        <text x="195" y="210">NLP</text>
        <text x="290" y="210">Machine Learning</text>
      </g>
    </g>
  </g>
</svg>
